<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>V20 Sheet</title>
<meta name="theme-color" content="#151110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="V20 Sheet">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<style>
:root{ --bg:#151110; --paper:#efe6d2; --ink:#1c1613; --mute:#7a6c5c; --line:#b9aa8e; --red:#a3201c; --green:#1f7a3a; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font:16px/1.35 Georgia,"Times New Roman",serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
.bar{ position:sticky; top:0; z-index:5; display:flex; gap:6px; align-items:center; padding:8px;
  background:var(--bg); border-bottom:1px solid #3a302a; }
.bar select,.bar button{ font:inherit; font-size:14px; padding:7px 9px; border-radius:6px; border:1px solid #5a4c40;
  background:#241d19; color:var(--paper); }
.bar select{ flex:1; min-width:0; }
main{ max-width:760px; margin:0 auto; background:var(--paper); padding:14px 12px 40px; }
h1{ font-size:22px; margin:0; text-align:center; letter-spacing:.04em; }
.ver{ text-align:center; color:var(--mute); font-size:11px; letter-spacing:.1em; margin-bottom:10px; }
h2{ font-size:14px; letter-spacing:.14em; text-transform:uppercase; border-top:2px solid var(--ink);
  border-bottom:1px solid var(--line); padding:5px 0; margin:18px 0 8px; text-align:center; }
h3{ font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); margin:10px 0 4px; }
input,textarea{ font:inherit; color:var(--ink); background:transparent; border:none; border-bottom:1px solid var(--line);
  border-radius:0; padding:3px 2px; min-width:0; }
textarea{ width:100%; border:1px solid var(--line); border-radius:4px; padding:8px; min-height:110px; resize:vertical; }
.idgrid{ display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; }
.idgrid label{ font-size:11px; color:var(--mute); letter-spacing:.08em; text-transform:uppercase; display:flex; flex-direction:column; }
.cols{ display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:0 16px; }
.row{ display:flex; align-items:center; gap:6px; padding:3px 0; }
.row .nm{ flex:1; min-width:0; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row input.nm{ flex:1; }
button.nm{ font:inherit; font-size:14px; text-align:left; background:none; border:none; padding:2px 0; color:var(--ink); cursor:pointer; }
button.nm.has{ text-decoration:underline dotted var(--mute); text-underline-offset:3px; }
button.nm .ph{ color:var(--mute); font-style:italic; }
.spline{ display:flex; gap:6px; padding:0 0 6px 10px; border-left:2px solid var(--line); margin:0 0 4px 2px; }
.spline input{ flex:1; font-size:13px; font-style:italic; }
.spline input.spn{ flex:0 0 40%; font-style:normal; }
.dots{ display:flex; gap:3px; flex:none; }
.dot{ width:17px; height:17px; border-radius:50%; border:1.5px solid var(--ink); background:transparent; padding:0; }
.dot.on{ background:var(--ink); }
.box{ width:19px; height:19px; border:1.5px solid var(--ink); background:transparent; padding:0; font:700 13px/1 Georgia,serif; color:var(--ink); }
.box.on{ background:var(--ink); }
.boxes{ display:flex; flex-wrap:wrap; gap:3px; }
.boxes .gap{ width:6px; }
.x{ border:none; background:none; color:var(--mute); font-size:16px; padding:0 4px; }
.add{ font:inherit; font-size:12px; border:1px dashed var(--line); background:none; color:var(--mute); padding:3px 8px; border-radius:4px; margin-top:4px; }
.hl{ display:flex; align-items:center; gap:8px; padding:2px 0; font-size:14px; }
.hl span{ flex:0 0 120px; } .hl small{ color:var(--mute); }
.dice{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.dice button,.btn{ font:inherit; padding:8px 12px; border:1px solid var(--ink); background:var(--ink); color:var(--paper); border-radius:6px; }
.dice .pm{ width:40px; background:none; color:var(--ink); }
.dice b{ display:inline-block; min-width:26px; text-align:center; font-size:18px; }
.faces{ display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 4px; min-height:40px; }
.face{ width:38px; height:38px; border-radius:6px; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center;
  font:700 18px Georgia,serif; color:var(--mute); }
.face.g{ color:var(--green); border-color:var(--green); }
.face.r{ color:var(--red); border-color:var(--red); }
.face.k{ color:#fff; background:#000; border-color:#000; }
.past{ font-size:12px; color:var(--mute); }
.xprow{ display:grid; grid-template-columns:62px 1fr 52px 22px; gap:6px; align-items:center; padding:2px 0; }
.xprow input{ width:100%; font-size:14px; } .xprow .amt{ text-align:right; }
.xprow .neg{ color:var(--red); } .xprow .pos{ color:var(--green); }
.tot{ font-size:14px; margin:6px 0; } .tot b{ font-size:16px; }
.locked .x,.locked .add{ display:none; }
.io{ display:flex; flex-wrap:wrap; gap:8px; }
.io .btn{ background:none; color:var(--ink); font-size:13px; }
</style>
</head>
<body>
<div class="bar">
  <select id="slotSel"></select>
  <button id="lockBtn"></button>
  <button id="menuBtn">&#8943;</button>
</div>
<main id="app"></main>
<script>
"use strict";
const APP_VERSION = "2.1.0", APP_BUILD = "2026-11-18";
const KEY = "v20_simple_v1", OLD_KEY = "vtm_sheets_v2";
const ATTRS = {Physical:["Strength","Dexterity","Stamina"], Social:["Charisma","Manipulation","Appearance"], Mental:["Perception","Intelligence","Wits"]};
const ROSTER = {
  Talents:["Alertness","Athletics","Awareness","Brawl","Empathy","Expression","Intimidation","Leadership","Streetwise","Subterfuge"],
  Skills:["Animal Ken","Crafts","Drive","Etiquette","Firearms","Larceny","Melee","Performance","Stealth","Survival"],
  Knowledges:["Academics","Computer","Finance","Investigation","Law","Medicine","Occult","Politics","Science","Technology"]};
const VIRTUES = ["Conscience","Self-Control","Courage"];
const HEALTH = [["Bruised",""],["Hurt","−1"],["Injured","−1"],["Wounded","−2"],["Mauled","−2"],["Crippled","−5"],["Incapacitated",""]];
const HMARK = ["","/","X","✱"];   /* empty, bashing, lethal, aggravated */
const IDF = [["name","Name"],["clan","Clan"],["generation","Generation"],["sire","Sire"],["nature","Nature"],["demeanor","Demeanor"],["concept","Concept"],["chronicle","Chronicle"]];

/* seed: [rating, specialty] or rating */
const SEEDS = {
  MJD:{ id:{name:"Mitchell James Daniels",clan:"Lasombra",generation:"10th",sire:"Serrano",nature:"Soldier",demeanor:"Perfectionist",chronicle:"MJD (closed, S58)"},
    attr:{Strength:2,Dexterity:3,Stamina:3,Charisma:[4,"Sincerity"],Manipulation:3,Appearance:3,Perception:[4,"Scan Pattern"],Intelligence:3,Wits:[4,"Reading the Room"]},
    abil:{Talents:{Alertness:3,Athletics:3,Awareness:1,Brawl:3,Empathy:[5,"What It Costs Them"],Intimidation:1,Leadership:[4,"Under Load"],Streetwise:3,Subterfuge:[5,"Smooth Talking"]},
          Skills:{Pilot:3,Drive:3,Etiquette:2,Firearms:3,Stealth:2,Survival:2},
          Knowledges:{Academics:1,Investigation:2,Linguistics:[1,"Spanish"],Medicine:2,Science:1,Technology:1}},
    disc:[["Dominate",1],["Obtenebration",2],["(unrevealed)",1]], bg:[["Resources",2],["Contacts",1]],
    virt:{Conscience:3,"Self-Control":4,Courage:4}, hum:7, wp:9,
    mf:"Merits: Calm Heart, Time Sense\nFlaws: Ward — Courtney; Enemy — Rebekah / custody; Overconfident" },
  Mitch:{ id:{name:"Mitch Daniels",clan:"Lasombra",generation:"11th",concept:"Airline first officer, Guard captain, newly Embraced",chronicle:"Mitch"},
    attr:{Strength:2,Dexterity:3,Stamina:3,Charisma:3,Manipulation:2,Appearance:2,Perception:4,Intelligence:3,Wits:3},
    abil:{Talents:{Alertness:3,Athletics:2,Brawl:2,Intimidation:1,Leadership:3},
          Skills:{Drive:2,Etiquette:1,Firearms:3,Melee:1,Pilot:3,Stealth:1,Survival:2},
          Knowledges:{Academics:1,Computer:1,Medicine:1,Science:1,Technology:1}},
    disc:[["Dominate",1],["Obtenebration",1],["Potence",1]], bg:[["Generation",2],["Resources",2],["Contacts",1]],
    virt:{Conscience:3,"Self-Control":3,Courage:4}, hum:7, wp:8, mf:"" }
};

let DB, S, LOCK = false;
const OPEN = new Set();   /* which specialty lines are open; view only, not saved */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const uid = () => "c"+Math.random().toString(36).slice(2,9);
const rd = v => Array.isArray(v) ? {d:v[0], spec:v[1]||""} : {d:v||0, spec:""};

function makeChar(title, seed){
  seed = seed || {};
  const c = { key:uid(), title:title, id:Object.assign({}, seed.id||{}), attr:{}, abil:{}, disc:[], bg:[],
    virt:{}, hum:seed.hum||7, wp:seed.wp||1, wpTemp:seed.wp||1, blood:0, health:[0,0,0,0,0,0,0],
    mf:seed.mf||"", notes:"", xp:[], dice:6, diff:6, rolls:[] };
  Object.keys(ATTRS).forEach(g => ATTRS[g].forEach(n => c.attr[n] = seed.attr && n in seed.attr ? rd(seed.attr[n]) : {d:1, spec:""}));
  Object.keys(ROSTER).forEach(function(g){
    const src = (seed.abil && seed.abil[g]) || {};
    c.abil[g] = ROSTER[g].map(n => Object.assign({n:n}, rd(src[n])));
    Object.keys(src).filter(n => ROSTER[g].indexOf(n) < 0).forEach(n => c.abil[g].push(Object.assign({n:n}, rd(src[n]))));
  });
  VIRTUES.forEach(n => c.virt[n] = (seed.virt && seed.virt[n]) || 1);
  c.disc = (seed.disc||[]).map(a => ({n:a[0], d:a[1]}));
  c.bg = (seed.bg||[]).map(a => ({n:a[0], d:a[1]}));
  return c;
}
/* One-time carry-over of the old app's XP ledger, notes and pools into MJD. Old data is left untouched. */
function carryOld(c){
  try{
    const old = JSON.parse(localStorage.getItem(OLD_KEY) || "null");
    const s = old && old.slots.filter(x => /daniels/i.test(((x.sheet||{}).identity||{}).name||"") || /mitch|mjd/i.test(x.name||""))[0];
    if(!s || !s.player) return;
    const P = s.player;
    c.xp = (P.xpLog||[]).map(function(e){
      const v = parseInt(e.xp,10) || 0;
      return { when:e.session||"", what:[e.trait, e.change, e.note].filter(Boolean).join(" "), amt:e.kind==="award" ? v : -v };
    });
    c.notes = P.notes || "";
    if(typeof P.blood === "number") c.blood = P.blood;
    if(typeof P.wpTemp === "number") c.wpTemp = P.wpTemp;
  }catch(e){}
}
function load(){
  try{ DB = JSON.parse(localStorage.getItem(KEY) || "null"); }catch(e){ DB = null; }
  if(!DB || !Array.isArray(DB.chars) || !DB.chars.length){
    const mjd = makeChar("MJD", SEEDS.MJD), mitch = makeChar("Mitch", SEEDS.Mitch);
    carryOld(mjd);
    DB = { v:1, active:mitch.key, lock:false, chars:[mjd, mitch] };
  }
  LOCK = !!DB.lock;
  S = DB.chars.filter(c => c.key === DB.active)[0] || DB.chars[0];
}
function save(){ DB.lock = LOCK; try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }

/* ---------- rendering ---------- */
function dots(path, n, max){
  let h = '<span class="dots">';
  for(let i=1;i<=max;i++) h += '<button class="dot'+(i<=n?' on':'')+'" data-dot="'+path+'" data-i="'+i+'" aria-label="'+i+'"></button>';
  return h + '</span>';
}
function boxes(kind, n, max){
  let h = '<div class="boxes">';
  for(let i=1;i<=max;i++) h += '<button class="box'+(i<=n?' on':'')+'" data-box="'+kind+'" data-i="'+i+'"></button>'+(i%5===0&&i<max?'<span class="gap"></span>':'');
  return h + '</div>';
}
/* Tap a trait's name to open its specialty line (full width, under the row).
   A dotted underline on the name means a specialty is written there. */
function traitRow(path, name, t, custom){
  const open = OPEN.has(path);
  return '<div class="row">'+
    '<button class="nm'+(t.spec?' has':'')+'" data-spec="'+path+'">'+(name ? esc(name) : '<span class="ph">name</span>')+'</button>'+
    dots(path+'.d', t.d, 5)+(custom ? '<button class="x" data-del="'+path+'">×</button>' : '')+'</div>'+
    (open ? '<div class="spline">'+
      (custom ? '<input class="spn" data-f="'+path+'.n" value="'+esc(name)+'" placeholder="name">' : '')+
      '<input data-f="'+path+'.spec" value="'+esc(t.spec||"")+'" placeholder="specialty"></div>' : '');
}
function focusLine(path){
  const nm = document.querySelector('[data-f="'+path+'.n"]'), sp = document.querySelector('[data-f="'+path+'.spec"]');
  if(nm && !nm.value) nm.focus(); else if(sp && !sp.value) sp.focus();
}
function listRow(path, t){
  return '<div class="row"><input class="nm" style="flex:1" data-f="'+path+'.n" value="'+esc(t.n)+'" placeholder="name">'+
    dots(path+'.d', t.d, 5)+'<button class="x" data-del="'+path+'">×</button></div>';
}
function render(){
  document.body.classList.toggle("locked", LOCK);
  $("slotSel").innerHTML = DB.chars.map(c => '<option value="'+c.key+'"'+(c===S?' selected':'')+'>'+esc(c.title)+'</option>').join("");
  $("lockBtn").textContent = LOCK ? "🔒 Locked" : "🔓 Editing";
  const xp = S.xp.reduce((a,e) => { const v = Number(e.amt)||0; if(v>0) a.e += v; else a.s -= v; return a; }, {e:0,s:0});
  let h = '<h1>'+esc(S.title)+'</h1><div class="ver">V20 SHEET · v'+APP_VERSION+' · '+APP_BUILD+'</div>';
  h += '<div class="idgrid">'+IDF.map(f => '<label>'+f[1]+'<input data-f="id.'+f[0]+'" value="'+esc(S.id[f[0]]||"")+'"></label>').join("")+'</div>';
  h += '<h2>Attributes</h2><div class="cols">'+Object.keys(ATTRS).map(g => '<div><h3>'+g+'</h3>'+
        ATTRS[g].map(n => traitRow('attr.'+n, n, S.attr[n])).join("")+'</div>').join("")+'</div>';
  h += '<h2>Abilities</h2><div class="cols">'+Object.keys(ROSTER).map(g => '<div><h3>'+g+'</h3>'+
        S.abil[g].map((t,i) => traitRow('abil.'+g+'.'+i, t.n, t, ROSTER[g].indexOf(t.n)<0)).join("")+
        '<button class="add" data-add="abil.'+g+'">+ add</button></div>').join("")+'</div>';
  h += '<h2>Advantages</h2><div class="cols">'+
        '<div><h3>Disciplines</h3>'+S.disc.map((t,i) => listRow('disc.'+i, t)).join("")+'<button class="add" data-add="disc">+ add</button></div>'+
        '<div><h3>Backgrounds</h3>'+S.bg.map((t,i) => listRow('bg.'+i, t)).join("")+'<button class="add" data-add="bg">+ add</button></div>'+
        '<div><h3>Virtues</h3>'+VIRTUES.map(n => '<div class="row"><span class="nm" style="flex:1">'+n+'</span>'+dots('virt.'+n, S.virt[n], 5)+'</div>').join("")+'</div></div>';
  h += '<h2>Condition</h2><div class="cols"><div>'+
        '<h3>Humanity / Path</h3>'+dots('hum', S.hum, 10)+
        '<h3>Willpower</h3>'+dots('wp', S.wp, 10)+'<div style="height:5px"></div>'+boxes('wpTemp', S.wpTemp, 10)+
        '<h3>Blood pool — '+S.blood+'</h3>'+boxes('blood', S.blood, 20)+'</div>'+
        '<div><h3>Health (tap: / bashing, X lethal, ✱ aggravated)</h3>'+HEALTH.map((l,i) =>
          '<div class="hl"><span>'+l[0]+' <small>'+l[1]+'</small></span><button class="box" data-health="'+i+'">'+HMARK[S.health[i]||0]+'</button></div>').join("")+'</div></div>';
  h += '<h2>Merits &amp; Flaws</h2><textarea data-f="mf" style="min-height:60px">'+esc(S.mf)+'</textarea>';
  h += '<h2>Dice</h2><div class="dice">Dice <button class="pm" data-dn="-1">−</button><b>'+S.dice+'</b><button class="pm" data-dn="1">+</button>'+
        ' &nbsp;Difficulty <button class="pm" data-df="-1">−</button><b>'+S.diff+'</b><button class="pm" data-df="1">+</button>'+
        ' <button id="rollBtn">Roll</button></div><div class="faces" id="faces">'+facesHtml(S.rolls[0])+'</div>'+
        '<div class="past">'+S.rolls.slice(1,4).map(r => r.f.join(" ")+' @'+r.d).join(" &nbsp;·&nbsp; ")+'</div>';
  h += '<h2>Experience</h2><div class="tot">Earned <b>'+xp.e+'</b> · Spent <b>'+xp.s+'</b> · Banked <b>'+(xp.e-xp.s)+'</b></div>'+
        S.xp.map((e,i) => '<div class="xprow"><input data-f="xp.'+i+'.when" value="'+esc(e.when)+'" placeholder="S1">'+
          '<input data-f="xp.'+i+'.what" value="'+esc(e.what)+'" placeholder="what">'+
          '<input class="amt '+(e.amt<0?'neg':'pos')+'" data-f="xp.'+i+'.amt" data-num="1" inputmode="text" value="'+(e.amt>0?'+':'')+e.amt+'">'+
          '<button class="x" data-del="xp.'+i+'">×</button></div>').join("")+
        '<button class="add" data-xp="1">+ award</button> <button class="add" data-xp="-1">− spend</button>';
  h += '<h2>Notes</h2><textarea data-f="notes" placeholder="Your notes">'+esc(S.notes)+'</textarea>';
  h += '<h2>Backup</h2><div class="io"><button class="btn" id="expBtn">Download backup</button><button class="btn" id="impBtn">Restore from backup</button></div>'+
        '<input type="file" id="impFile" accept=".json,application/json" style="display:none">';
  $("app").innerHTML = h;
}
function facesHtml(r){
  if(!r) return "";
  return r.f.map(f => '<span class="face '+(f===10?'k':f===1?'r':f>=r.d?'g':'')+'">'+f+'</span>').join("");
}

/* ---------- path access ---------- */
function at(path){
  const p = path.split("."); let o = S;
  for(let i=0;i<p.length-1;i++) o = o[p[i]];
  return [o, p[p.length-1]];
}

/* ---------- events ---------- */
$("app").addEventListener("click", function(ev){
  const t = ev.target.closest("button"); if(!t) return;
  const d = t.dataset;
  if(d.dn){ S.dice = Math.max(1, Math.min(30, S.dice + Number(d.dn))); }
  else if(d.df){ S.diff = Math.max(2, Math.min(10, S.diff + Number(d.df))); }
  else if(t.id === "rollBtn"){
    const f = []; const buf = new Uint32Array(S.dice); crypto.getRandomValues(buf);
    for(let i=0;i<S.dice;i++) f.push(buf[i] % 10 + 1);
    f.sort((a,b) => b-a); S.rolls.unshift({f:f, d:S.diff}); S.rolls = S.rolls.slice(0,4);
  }
  else if(d.box){ const i = Number(d.i); S[d.box] = (S[d.box] === i) ? i-1 : i; }
  else if(d.health){ const i = Number(d.health); S.health[i] = ((S.health[i]||0) + 1) % 4; }
  else if(t.id === "expBtn"){ return exportAll(); }
  else if(t.id === "impBtn"){ return $("impFile").click(); }
  else if(d.spec){
    if(OPEN.has(d.spec)) OPEN.delete(d.spec); else OPEN.add(d.spec);
    render(); if(OPEN.has(d.spec)) focusLine(d.spec); return;
  }
  else if(LOCK){ return; }
  else if(d.dot){ const a = at(d.dot), i = Number(d.i); a[0][a[1]] = (a[0][a[1]] === i) ? i-1 : i; }
  else if(d.add){
    const a = at(d.add+".x"); a[0].push({n:"", d:0, spec:""});
    if(d.add.indexOf("abil.") === 0){ const p = d.add+"."+(a[0].length-1); OPEN.add(p); save(); render(); return focusLine(p); }
  }
  else if(d.del){ const a = at(d.del); a[0].splice(Number(a[1]), 1); OPEN.clear(); }
  else if(d.xp){ S.xp.push({when:"", what:"", amt:Number(d.xp)}); }
  else return;
  save(); render();
});
$("app").addEventListener("change", function(ev){
  const t = ev.target;
  if(t.id === "impFile"){ return importAll(t.files[0]); }
  if(!t.dataset.f) return;
  const a = at(t.dataset.f);
  if(t.dataset.num){
    const raw = String(t.value).trim().replace("−","-"); let v = parseInt(raw,10) || 0;
    if(!/^[+-]/.test(raw) && a[0][a[1]] < 0) v = -Math.abs(v);   /* a spend row stays a spend unless you type + */
    a[0][a[1]] = v;
  } else a[0][a[1]] = t.value;
  save();
  /* keep the name button in step without a re-render, so the next tap isn't swallowed */
  const m = /^(.*)\.(spec|n)$/.exec(t.dataset.f), b = m && document.querySelector('button.nm[data-spec="'+m[1]+'"]');
  if(b){
    if(m[2] === "spec") b.classList.toggle("has", !!t.value.trim());
    else b.innerHTML = t.value ? esc(t.value) : '<span class="ph">name</span>';
  }
  if(t.dataset.num || t.dataset.f === "id.name") render();
});
$("slotSel").addEventListener("change", function(){ DB.active = this.value; S = DB.chars.filter(c => c.key === DB.active)[0]; OPEN.clear(); save(); render(); });
$("lockBtn").addEventListener("click", function(){ LOCK = !LOCK; save(); render(); });
$("menuBtn").addEventListener("click", function(){
  const c = prompt("Type: new, rename, or delete", "");
  if(!c) return;
  const k = c.trim().toLowerCase();
  if(k === "new"){ const n = prompt("Title for the new sheet:", ""); if(!n) return; S = makeChar(n.trim()); DB.chars.push(S); DB.active = S.key; }
  else if(k === "rename"){ const n = prompt("New title:", S.title); if(!n) return; S.title = n.trim(); }
  else if(k === "delete"){
    if(DB.chars.length < 2 || !confirm('Delete "'+S.title+'"? This cannot be undone.')) return;
    DB.chars = DB.chars.filter(x => x !== S); S = DB.chars[0]; DB.active = S.key;
  } else return;
  save(); render();
});
function exportAll(){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(DB, null, 1)], {type:"application/json"}));
  a.download = "v20-sheets-"+new Date().toISOString().slice(0,10)+".json"; a.click();
}
function importAll(file){
  if(!file) return;
  file.text().then(function(txt){
    const d = JSON.parse(txt);
    if(!d || !Array.isArray(d.chars) || !d.chars.length) throw new Error("shape");
    if(!confirm("Replace everything on this device with the backup?")) return;
    DB = d; LOCK = !!DB.lock; S = DB.chars.filter(c => c.key === DB.active)[0] || DB.chars[0]; save(); render();
  }).catch(function(){ alert("That file is not a backup from this app."); });
}

load(); render();
if("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
</script>
